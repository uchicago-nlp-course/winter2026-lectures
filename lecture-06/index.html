                <section data-markdown>
                    <textarea data-template>
                        ## The Bottleneck Problem

                        In recurrent language models, the hidden state must carry all context from previous tokens.

                        Problems:
                        - Information bottleneck: Fixed-size hidden state limits memory
                        - Early tokens must flow through all intermediate states to influence later predictions
                        - Context from the beginning of long sequences gets "forgotten"

                        The hidden state needs to capture all relevant information from the entire prefix!
                    </textarea>
                </section>

                <section data-markdown>
                    <textarea data-template>
                        ## Issues with Recurrent Models

                        Linear Interaction Distance:
                        - RNNs are unrolled left-to-right
                        - Takes O(sequence length) steps for distant words to interact
                        - Hard to learn long-distance dependencies (gradient problems)

                        Lack of Parallelizability:
                        - Forward/backward passes have O(sequence length) sequential operations
                        - Future hidden states depend on past hidden states
                        - Cannot fully utilize GPU parallelism
                    </textarea>
                </section>

                <section data-markdown>
                    <textarea data-template>
                        ## Self attention: The Solution

                        Core idea: Allow each token to directly attend to all previous tokens in the sequence.

                        - No recurrence needed: Process all positions in parallel
                        - Direct access: Any token can directly "look at" any other token
                        - Solves the bottleneck: No need to compress everything into a fixed-size state

                        <p class="citation">Vaswani et al. (2017): Attention Is All You Need</p>
                    </textarea>
                </section>

                <section data-markdown>
                    <textarea data-template>
                        ## Self attention Benefits

                        Compared to RNNs:

                        | Aspect | RNN | Self attention |
                        |--------|-----|----------------|
                        | Interaction distance | O(n) | O(1) |
                        | Parallelization | Sequential | Fully parallel |
                        | Long-range dependencies | Difficult | Direct |

                        All words interact at every layer with O(1) path length!
                    </textarea>
                </section>

                <section data-markdown>
                    <textarea data-template>
                        ## Self attention: The Equation

                        $$\operatorname{Attention}(Q, K, V) = \operatorname{softmax}\left(\frac{QK^T}{\sqrt{d_k}}\right)V$$

                        where $Q = XW^Q$, $K = XW^K$, $V = XW^V$

                        Let's unpack this equation step by step.
                    </textarea>
                </section>

                <section data-markdown>
                    <textarea data-template>
                        ## Queries, Keys, and Values

                        Think of attention as a soft dictionary lookup:

                        - Query ($q$): "What am I looking for?"
                        - Key ($k$): "What do I contain?"
                        - Value ($v$): "What do I return if matched?"

                        The attention score $q^T k$ measures how well a query matches a key.

                        High score = high relevance = more weight on that value.
                    </textarea>
                </section>

                <section data-markdown>
                    <textarea data-template>
                        ## Attention at One Position

                        For position $t$, compute its output by attending to all positions:

                        1. Compute query, keys, values:
                        $q_t = W^Q x_t, \quad k_j = W^K x_j, \quad v_j = W^V x_j$

                        2. Compute attention scores:
                        $e_{tj} = \frac{q_t^T k_j}{\sqrt{d_k}}$

                        3. Softmax to get attention weights: $\alpha_{tj} = \operatorname{softmax}(e_{tj})$                        

                        4. Weighted sum of values:
                        $o_t = \sum_j \alpha_{tj} v_j$
                    </textarea>
                </section>

                <section data-markdown>
                    <textarea data-template>
                        ## Computing All Positions Together

                        Let $X \in \mathbb{R}^{n \times d}$ be the input sequence matrix.

                        Stack all queries, keys, values into matrices:
                        $$Q = XW^Q, \quad K = XW^K, \quad V = XW^V$$

                        Compute all attention outputs in one matrix operation:
                        $$\operatorname{Attention}(Q, K, V) = \operatorname{softmax}\left(\frac{QK^T}{\sqrt{d_k}}\right)V$$

                        Efficient parallelization on GPUs!
                    </textarea>
                </section>

                <section data-markdown>
                    <textarea data-template>
                        ## Causal Masking

                        For autoregressive language models, we must not look at future tokens.

                        Mask out future positions by setting their scores to $-\infty$:

                        $$e_{ij} = \begin{cases} \frac{q_i^T k_j}{\sqrt{d_k}} & \text{if } j \leq i \\ -\infty & \text{if } j > i \end{cases}$$

                        After softmax, future positions get zero weight.

                        This is called "causal" or "masked" Self attention.
                    </textarea>
                </section>
            

                <section data-markdown>
                    <textarea data-template>
                        ## Single-Head Attention: Dimensions

                        Typical dimensions (e.g., GPT-style):
                        - Model dimension: $d = 512$
                        - Key/Query dimension: $d_k = 64$
                        - Value dimension: $d_v = 64$

                        Parameters for one attention head:
                        - $W^Q \in \mathbb{R}^{d \times d_k}$: $d \cdot d_k = 512 \times 64 = 32,768$
                        - $W^K \in \mathbb{R}^{d \times d_k}$: $d \cdot d_k = 512 \times 64 = 32,768$
                        - $W^V \in \mathbb{R}^{d \times d_v}$: $d \cdot d_v = 512 \times 64 = 32,768$

                        Total: $d(2d_k + d_v) = 512 \times 192 = 98,304$ parameters
                    </textarea>
                </section>

                <section data-markdown>
                    <textarea data-template>
                        ## Multi-Head Attention

                        Idea: Run multiple attention functions in parallel.

                        Why? Different heads can learn to attend to different things:
                        - Syntactic relationships
                        - Semantic relationships
                        - Positional patterns

                        <p class="citation">Vaswani et al. (2017): Attention Is All You Need</p>
                    </textarea>
                </section>

                <section data-markdown>
                    <textarea data-template>
                        ## Multi-Head Attention: Mechanism

                        For $h$ heads, each with separate $W^Q_i, W^K_i, W^V_i$:

                        $$\operatorname{head}_i = \operatorname{Attention}(XW^Q_i, XW^K_i, XW^V_i)$$

                        Concatenate and project:
                        $$\operatorname{MultiHead}(X) = \operatorname{Concat}(\operatorname{head}_1, \ldots, \operatorname{head}_h)W^O$$

                        Typical settings: 8 heads with $d_k = d/8 = 64$ (for $d=512$)
                    </textarea>
                </section>

                <section data-markdown>
                    <textarea data-template>
                        ## Multi-Head Attention: Parameter Count

                        With $h = 8$ heads, $d = 512$, $d_k = d_v = 64$:

                        Per-head projections:
                        - $W^Q_i, W^K_i, W^V_i$: $h \cdot d \cdot (2d_k + d_v) = 8 \times 512 \times 192 = 786,432$

                        Output projection:
                        - $W^O \in \mathbb{R}^{(h \cdot d_v) \times d}$: $(h \cdot d_v) \cdot d = 512 \times 512 = 262,144$

                        Total: $h \cdot d \cdot (2d_k + d_v) + h \cdot d_v \cdot d = 1,048,576$ parameters

                        When $d_k = d_v = d/h$: Total $= 4d^2$
                    </textarea>
                </section>
            </section>

                <section data-markdown>
                    <textarea data-template>
                        ## Attention: A General Technique

                        Attention is not just for transformers!

                        Core idea: Compute weighted combinations based on relevance scores.

                        Can be applied to:
                        - Self attention: Attend within a single sequence
                        - Cross-attention: Attend from one sequence to another
                        - Any task requiring soft alignment or matching
                    </textarea>
                </section>


                <section data-markdown>
                    <textarea data-template>
                        ## Attention Variants

                        Several ways to compute attention scores from query $q$ and key $k$:

                        | Type | Formula |
                        |------|---------|
                        | Dot Product | $e = q^T k$ |
                        | Scaled Dot Product | $e = \frac{q^T k}{\sqrt{d}}$ |
                        | Multiplicative | $e = q^T W k$ |
                        | Additive | $e = v^T \tanh(W_1 q + W_2 k)$ |
                    </textarea>
                </section>

                <section data-markdown>
                    <textarea data-template>
                        ## Scaled Dot Product Attention

                        $$e = \frac{q^T k}{\sqrt{d}}$$

                        - Simplest form: just compute inner product
                        - Scaling by $\sqrt{d}$ prevents softmax from having extremely small gradients when $d$ is large
                        - Fast and efficient

                        In practice, scaled dot product is most common due to efficiency.

                        <p class="citation">Vaswani et al. (2017)</p>
                    </textarea>
                </section>

                                <section data-markdown>
                    <textarea data-template>
                        ## Example: Decomposable Attention for NLI

                        <div style="display: flex; align-items: center;">
                        <div style="flex: 1;">

                        Natural Language Inference: Does hypothesis follow from premise?

                        Three steps using attention:

                        1. Attend: Soft-align tokens between premise and hypothesis
                        2. Compare: Compare each token with its aligned representation
                        3. Aggregate: Pool comparisons to classify

                        No RNNs or convolutions needed!

                        </div>
                        <div style="flex: 1; text-align: center;">
                        <img src="images/nli-attention.png" alt="Decomposable Attention" style="max-height: 500px;">
                        <p class="citation">Parikh et al. (2016)</p>
                        </div>
                        </div>
                    </textarea>
                </section>

                <section data-markdown>
                    <textarea data-template>
                        ## Decomposable Attention: The Attend Step

                        <div style="display: flex; align-items: center;">
                        <div style="flex: 1;">

                        Given premise $A \in \mathbb{R}^{m \times d}$ and hypothesis $B \in \mathbb{R}^{n \times d}$:

                        Compute attention matrix:
                        $E = f(A) \cdot f(B)^T \in \mathbb{R}^{m \times n}$

                        Align hypothesis to premise:
                        $\beta = \operatorname{softmax}(E) \cdot B$

                        Align premise to hypothesis:
                        $\alpha = \operatorname{softmax}(E^T) \cdot A$

                        Each premise token gets a weighted summary of relevant hypothesis tokens (and vice versa).

                        </div>
                        <div style="flex: 1; text-align: center;">
                        <img src="images/nli-attention.png" alt="Decomposable Attention" style="max-height: 500px;">
                        <p class="citation">Parikh et al. (2016)</p>
                        </div>
                        </div>
                    </textarea>
                </section>

                <section data-markdown>
                    <textarea data-template>
                        ## Decomposable Attention: Compare & Aggregate

                        <div style="display: flex; align-items: center;">
                        <div style="flex: 1;">

                        Compare each token with its aligned counterpart:
                        $V_A = g([A, \beta])$, $V_B = g([B, \alpha])$

                        Aggregate via sum pooling:
                        $v_A = \sum_i V_{A,i}$, $v_B = \sum_j V_{B,j}$

                        Classify:
                        $\hat{y} = h([v_A, v_B])$

                        Key insight: Attention enables comparing sequences of different lengths without recurrence.

                        </div>
                        <div style="flex: 1; text-align: center;">
                        <img src="images/nli-attention.png" alt="Decomposable Attention" style="max-height: 500px;">
                        <p class="citation">Parikh et al. (2016)</p>
                        </div>
                        </div>
                    </textarea>
                </section>
