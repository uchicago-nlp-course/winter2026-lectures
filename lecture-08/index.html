                    <textarea data-template>
                        ## Recall: Causal Self-Attention

                        $$\text{Attention}(Q, K, V) = \text{softmax}\left(\frac{QK^T}{\sqrt{d\_k}} + M\right)V$$

                        where $M\_{ij} = \left\\{ \begin{array}{ll} 0 & j \leq i \\\ -\infty & j > i \end{array} \right.$

                        - Each position only attends to itself and previous positions
                        - Enables autoregressive language modeling
                        - Parallel training, sequential generation
                    </textarea>
                </section>

                <section data-markdown>
                    <textarea data-template>
                        ## The Complete Forward Pass

                        ```python
                        x = token_embed[input_ids] + position_embed  # Embed

                        for layer in transformer_layers:             # Each layer
                            x = x + layer.attn(layer.ln_1(x))        # Attention
                            x = x + layer.ffn(layer.ln_2(x))         # FFN

                        x = final_ln(x)                              # Final norm
                        logits = x @ W_U.T                           # Unembed
                        probs = softmax(logits)                      # Probabilities
                        ```

                        `@` is matrix multiplication (broadcasts over batch dimensions)
                    </textarea>
